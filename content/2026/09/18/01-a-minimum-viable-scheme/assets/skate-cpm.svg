<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Skate: Scheme for a small machine</title>
<desc id="desc">Planned compilation path: Scheme source passes through the Skate compiler and a linker, which adds runtime support, to produce a native Z80 CP/M program. Triptych runs on macOS and in a browser; ESP32-S3 hardware is planned.</desc>
