<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f5f0e6"/>
  <g font-family="Georgia, serif" fill="#20242a">
    <text x="600" y="66" text-anchor="middle" font-size="34">A shared heap of 256-byte pages</text>
    <text x="600" y="103" text-anchor="middle" font-size="19" fill="#59616b">Pages are assigned by allocation size, then returned when empty</text>
  </g>

  <g transform="translate(80 165)" stroke="#333b43" stroke-width="3">
    <g>
      <rect width="230" height="390" rx="8" fill="#dce9df"/>
      <text x="115" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#20242a" stroke="none">five-byte pairs</text>
      <g transform="translate(22 72)" stroke-width="2">
        <rect width="88" height="48" rx="5" fill="#5b9a70"/><rect x="98" width="88" height="48" rx="5" fill="#5b9a70"/>
        <rect y="58" width="88" height="48" rx="5" fill="#5b9a70"/><rect x="98" y="58" width="88" height="48" rx="5" fill="#f5f0e6" stroke-dasharray="7 5"/>
        <rect y="116" width="88" height="48" rx="5" fill="#5b9a70"/><rect x="98" y="116" width="88" height="48" rx="5" fill="#5b9a70"/>
        <rect y="174" width="88" height="48" rx="5" fill="#f5f0e6" stroke-dasharray="7 5"/><rect x="98" y="174" width="88" height="48" rx="5" fill="#5b9a70"/>
        <rect y="232" width="88" height="48" rx="5" fill="#5b9a70"/><rect x="98" y="232" width="88" height="48" rx="5" fill="#f5f0e6" stroke-dasharray="7 5"/>
      </g>
      <text x="115" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#374047" stroke="none">51 pairs per page</text>
    </g>

    <g transform="translate(270)">
      <rect width="230" height="390" rx="8" fill="#e4e0ef"/>
      <text x="115" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#20242a" stroke="none">bindings</text>
      <g transform="translate(22 72)" stroke-width="2">
        <rect width="55" height="43" rx="5" fill="#8370a5"/><rect x="65" width="55" height="43" rx="5" fill="#8370a5"/><rect x="130" width="55" height="43" rx="5" fill="#8370a5"/>
        <rect y="53" width="55" height="43" rx="5" fill="#8370a5"/><rect x="65" y="53" width="55" height="43" rx="5" fill="#f5f0e6" stroke-dasharray="7 5"/><rect x="130" y="53" width="55" height="43" rx="5" fill="#8370a5"/>
        <rect y="106" width="55" height="43" rx="5" fill="#8370a5"/><rect x="65" y="106" width="55" height="43" rx="5" fill="#8370a5"/><rect x="130" y="106" width="55" height="43" rx="5" fill="#8370a5"/>
        <rect y="159" width="55" height="43" rx="5" fill="#f5f0e6" stroke-dasharray="7 5"/><rect x="65" y="159" width="55" height="43" rx="5" fill="#8370a5"/><rect x="130" y="159" width="55" height="43" rx="5" fill="#8370a5"/>
        <rect y="212" width="55" height="43" rx="5" fill="#8370a5"/><rect x="65" y="212" width="55" height="43" rx="5" fill="#8370a5"/><rect x="130" y="212" width="55" height="43" rx="5" fill="#f5f0e6" stroke-dasharray="7 5"/>
      </g>
      <text x="115" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#374047" stroke="none">three-byte bindings</text>
    </g>

    <g transform="translate(540)">
      <rect width="230" height="390" rx="8" fill="#e8dfcf"/>
      <text x="115" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#20242a" stroke="none">rounded classes</text>
      <g transform="translate(22 76)" stroke-width="2">
        <rect width="186" height="62" rx="5" fill="#bc8d55"/>
        <text x="93" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#fff" stroke="none">closure</text>
        <rect y="76" width="118" height="48" rx="5" fill="#bc8d55"/>
        <text x="59" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#fff" stroke="none">string</text>
        <rect y="138" width="158" height="70" rx="5" fill="#bc8d55"/>
        <text x="79" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#fff" stroke="none">vector</text>
        <rect y="222" width="84" height="42" rx="5" fill="#f5f0e6" stroke-dasharray="7 5"/>
      </g>
      <text x="115" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#374047" stroke="none">four-byte size steps</text>
    </g>

    <g transform="translate(810)">
      <rect width="230" height="390" rx="8" fill="#eceae4" stroke-dasharray="12 8"/>
      <text x="115" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#20242a" stroke="none">free page</text>
      <path d="M115 112 V258" fill="none" stroke="#74808a" stroke-width="4"/>
      <path d="M90 232 L115 262 L140 232" fill="none" stroke="#74808a" stroke-width="4"/>
      <text x="115" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#59616b" stroke="none">ready for any</text>
      <text x="115" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#59616b" stroke="none">size class</text>
    </g>
  </g>

  <g font-family="Arial, sans-serif" fill="#374047">
    <text x="600" y="620" text-anchor="middle" font-size="21">Solid slots contain live objects. Dashed slots are free.</text>
    <path d="M195 658 C350 716 850 716 1005 658" fill="none" stroke="#59616b" stroke-width="3"/>
    <path d="M988 648 L1008 658 L991 672" fill="none" stroke="#59616b" stroke-width="3"/>
    <text x="600" y="724" text-anchor="middle" font-size="20">When every slot is free, the page returns to the shared bitmap.</text>
  </g>
</svg>
