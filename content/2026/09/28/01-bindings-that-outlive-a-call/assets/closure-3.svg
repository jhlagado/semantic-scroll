<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Making space for closures</title>
  <desc id="desc">A three-stage diagram showing a make-adder call creating a closure, the call returning while the closure keeps its captured binding n equal to two alive, and a later call combining that captured binding with a fresh argument. A collector keeps reachable objects and returns unreachable slots to the heap.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#a6b5ba" stroke-opacity=".16"/>
    </pattern>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L10 6L1 11" fill="none" stroke="#4277a3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L10 6L1 11" fill="none" stroke="#32877b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L10 6L1 11" fill="none" stroke="#b75936" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #213c42; }
      .mono { font-family: 'DejaVu Sans Mono', monospace; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 2px; }
      .title { font-size: 38px; font-weight: 700; letter-spacing: .4px; }
      .subtitle { font-size: 19px; fill: #4f686b; }
      .panel-title { font-size: 22px; font-weight: 700; }
      .label { font-size: 17px; fill: #4f686b; }
      .small { font-size: 15px; fill: #4f686b; }
      .value { font-size: 25px; font-weight: 700; }
      .code { font-family: 'DejaVu Sans Mono', monospace; font-size: 17px; fill: #213c42; }
    </style>
  </defs>

  <rect width="900" height="1200" fill="#faf7ee"/>
  <rect width="900" height="1200" fill="url(#grid)"/>

  <rect x="48" y="52" width="9" height="102" fill="#cf6039"/>
  <text x="82" y="91" class="eyebrow" fill="#b75936">SKATE / Z80 / 64 KiB</text>
  <text x="82" y="135" class="title">MAKING SPACE FOR CLOSURES</text>
  <text x="82" y="168" class="subtitle">A procedure and the environment it keeps alive</text>
  <text x="842" y="91" text-anchor="end" class="mono small">LEXICAL SCOPE</text>
  <path d="M48 205H852" stroke="#9bacae" stroke-width="2"/>

  <!-- Stage 1 -->
  <text x="62" y="247" class="eyebrow" fill="#b75936">01 / CREATE</text>
  <text x="62" y="277" class="panel-title">The inner procedure captures n</text>

  <rect x="62" y="303" width="220" height="222" rx="10" fill="#e1edf5" stroke="#4277a3" stroke-width="3"/>
  <text x="84" y="337" class="eyebrow" fill="#4277a3">CALL STACK</text>
  <text x="84" y="378" class="value">make-adder</text>
  <text x="84" y="407" class="label">active call map</text>
  <line x1="84" y1="430" x2="260" y2="430" stroke="#9fb9ca" stroke-width="2"/>
  <text x="84" y="463" class="code">n  →  binding</text>
  <text x="84" y="494" class="small">argument value: 2</text>

  <path d="M284 411H350" fill="none" stroke="#4277a3" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <rect x="350" y="326" width="198" height="176" rx="10" fill="#fae4d4" stroke="#b75936" stroke-width="3"/>
  <text x="372" y="359" class="eyebrow" fill="#b75936">HEAP</text>
  <text x="372" y="394" class="value">n = 2</text>
  <text x="372" y="422" class="label">binding record</text>
  <text x="372" y="456" class="small">three bytes</text>
  <text x="372" y="480" class="small">shared, not copied</text>

  <path d="M550 411H616" fill="none" stroke="#32877b" stroke-width="4" marker-end="url(#arrow-green)"/>

  <rect x="616" y="303" width="222" height="222" rx="10" fill="#d9eee6" stroke="#32877b" stroke-width="3"/>
  <text x="638" y="337" class="eyebrow" fill="#32877b">HEAP OBJECT</text>
  <text x="638" y="378" class="value">closure</text>
  <rect x="638" y="399" width="178" height="48" rx="6" fill="#fbfaf6" stroke="#77a99d" stroke-width="2"/>
  <text x="727" y="429" text-anchor="middle" class="code">procedure descriptor</text>
  <rect x="638" y="461" width="178" height="42" rx="6" fill="#f5d39e" stroke="#cf9c4c" stroke-width="2"/>
  <text x="727" y="487" text-anchor="middle" class="small">capture → n</text>

  <text x="450" y="563" text-anchor="middle" class="small">The closure points to the existing binding record.</text>

  <!-- Stage 2 -->
  <text x="62" y="619" class="eyebrow" fill="#b75936">02 / RETURN</text>
  <text x="62" y="649" class="panel-title">The call ends, but the captured binding remains</text>

  <rect x="62" y="678" width="220" height="148" rx="10" fill="#e5e8e8" stroke="#879298" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="84" y="713" class="eyebrow" fill="#737f84">STACK SPACE</text>
  <text x="84" y="752" class="value" fill="#5c686d">released</text>
  <text x="84" y="785" class="small">available for reuse</text>
  <path d="M234 710L258 794M258 710L234 794" stroke="#b75936" stroke-width="4"/>

  <path d="M284 752H404" fill="none" stroke="#879298" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-orange)"/>

  <rect x="404" y="678" width="434" height="148" rx="10" fill="#fbfaf6" stroke="#32877b" stroke-width="3"/>
  <text x="430" y="713" class="eyebrow" fill="#32877b">LIVE ROOT</text>
  <text x="430" y="752" class="value">add-two → closure → n = 2</text>
  <text x="430" y="785" class="small">reachability keeps both heap objects available</text>

  <!-- Stage 3 -->
  <text x="62" y="908" class="eyebrow" fill="#b75936">03 / USE AND COLLECT</text>
  <text x="62" y="938" class="panel-title">A later call combines captured and fresh state</text>

  <rect x="62" y="963" width="190" height="126" rx="10" fill="#e1edf5" stroke="#4277a3" stroke-width="3"/>
  <text x="84" y="997" class="eyebrow" fill="#4277a3">NEW CALL</text>
  <text x="84" y="1037" class="value">x = 40</text>
  <text x="84" y="1067" class="small">fresh binding record</text>

  <path d="M254 1026H321" fill="none" stroke="#4277a3" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <rect x="321" y="963" width="230" height="126" rx="10" fill="#d9eee6" stroke="#32877b" stroke-width="3"/>
  <text x="343" y="997" class="eyebrow" fill="#32877b">PROCEDURE BODY</text>
  <text x="436" y="1040" text-anchor="middle" class="code">(+ n x)</text>
  <text x="436" y="1070" text-anchor="middle" class="value">2 + 40 = 42</text>

  <path d="M553 1026H620" fill="none" stroke="#32877b" stroke-width="4" marker-end="url(#arrow-green)"/>

  <rect x="620" y="963" width="218" height="126" rx="10" fill="#fae4d4" stroke="#b75936" stroke-width="3"/>
  <text x="642" y="997" class="eyebrow" fill="#b75936">COLLECTOR</text>
  <text x="642" y="1037" class="value">reachable: keep</text>
  <text x="642" y="1067" class="small">unreachable: reclaim</text>

  <path d="M62 1122H838" stroke="#9bacae" stroke-width="2"/>
  <text x="62" y="1156" class="label">A closure keeps the environment it needs.</text>
  <text x="62" y="1182" class="small">The collector keeps it until no live reference can reach it.</text>
</svg>
