<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="380" viewBox="0 0 1140 380" role="img" aria-labelledby="title desc">
  <title id="title">A reachable closure keeps its captured binding alive after the call returns.</title>
  <desc id="desc">A detailed memory diagram. The add-two root points to a closure object. The closure contains a procedure descriptor and a captured pointer to the heap binding n equals 2. A released call frame is shown beside a slab page whose live slots remain marked while empty slots can be reclaimed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8c27a"/>
    </marker>
    <marker id="small-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#79b7ab"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2c31"/>
      <stop offset="1" stop-color="#111c22"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8c27a"/>
      <stop offset="1" stop-color="#d98b55"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#30505a" stroke-width="1" opacity=".42"/>
    </pattern>
  </defs>

  <rect width="1140" height="380" rx="12" fill="url(#bg)"/>
  <rect x="1" y="1" width="1138" height="378" rx="11" fill="none" stroke="#41616a" stroke-width="2"/>
  <path d="M 32 62 H 1108" stroke="#41616a" stroke-width="1"/>
  <text x="34" y="38" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing=".4" fill="#f2e7cf">After the call returns, reachability keeps the environment alive</text>
  <text x="1106" y="38" text-anchor="end" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.2" fill="#79b7ab">SKATE / CLOSURE LIFETIME</text>

  <g>
    <rect x="34" y="86" width="236" height="174" rx="10" fill="#24383d" stroke="#79b7ab" stroke-width="2"/>
    <text x="54" y="110" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.4" fill="#79b7ab">PROGRAM ROOTS</text>
    <rect x="54" y="124" width="196" height="55" rx="7" fill="#edf3ef"/>
    <text x="70" y="147" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#213238">add-two</text>
    <text x="70" y="165" font-family="Arial,sans-serif" font-size="12" fill="#477467">reachable binding</text>
    <path d="M 250 151 C 278 151 282 151 310 151" fill="none" stroke="#e8c27a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="54" y="198" width="196" height="44" rx="7" fill="#17262b" stroke="#6b8185" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="70" y="217" font-family="Arial,sans-serif" font-size="12" fill="#b8c5c3">make-adder frame</text>
    <text x="70" y="234" font-family="Arial,sans-serif" font-size="11" fill="#82999a">stack space released</text>
    <path d="M 236 207 l 28 28 M 264 207 l -28 28" stroke="#d98b55" stroke-width="2"/>
  </g>

  <g>
    <rect x="310" y="86" width="344" height="174" rx="10" fill="#24383d" stroke="#e8c27a" stroke-width="2"/>
    <text x="332" y="110" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.4" fill="#e8c27a">HEAP OBJECT</text>
    <text x="632" y="110" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#b8c5c3">closure</text>
    <rect x="332" y="124" width="142" height="64" rx="7" fill="#edf3ef"/>
    <text x="347" y="148" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#213238">procedure</text>
    <text x="347" y="166" font-family="Arial,sans-serif" font-size="12" fill="#477467">descriptor</text>
    <rect x="490" y="124" width="142" height="64" rx="7" fill="#f5e8c6"/>
    <text x="505" y="148" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#4b3b25">capture slot</text>
    <text x="505" y="166" font-family="Arial,sans-serif" font-size="12" fill="#8a6139">pointer to n</text>
    <path d="M 474 156 H 490" fill="none" stroke="#79b7ab" stroke-width="2" marker-end="url(#small-arrow)"/>
    <path d="M 561 188 V 214" fill="none" stroke="#e8c27a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="332" y="224" font-family="Arial,sans-serif" font-size="12" fill="#b8c5c3">same compiled code</text>
    <text x="632" y="224" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#b8c5c3">captured pointer, not a copy</text>
    <path d="M 332 238 H 632" stroke="#41616a" stroke-width="1"/>
    <text x="332" y="252" font-family="Arial,sans-serif" font-size="11" fill="#79b7ab">procedure + environment</text>
  </g>

  <g>
    <path d="M 654 151 C 683 151 690 151 720 151" fill="none" stroke="#e8c27a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="720" y="86" width="386" height="174" rx="10" fill="#24383d" stroke="#79b7ab" stroke-width="2"/>
    <text x="742" y="110" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.4" fill="#79b7ab">HEAP / BINDING RECORD</text>
    <text x="1084" y="110" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#b8c5c3">three bytes</text>
    <rect x="742" y="124" width="342" height="58" rx="7" fill="url(#glow)"/>
    <text x="762" y="149" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#3c3030">n</text>
    <text x="810" y="149" font-family="Arial,sans-serif" font-size="15" fill="#3c3030">=</text>
    <text x="840" y="149" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#3c3030">2</text>
    <text x="762" y="168" font-family="Arial,sans-serif" font-size="11" fill="#5d4632">value</text>
    <text x="875" y="168" font-family="Arial,sans-serif" font-size="11" fill="#5d4632">type</text>
    <text x="1014" y="168" text-anchor="end" font-family="Arial,sans-serif" font-size="11" fill="#5d4632">state flags</text>
    <path d="M 742 203 H 1084" stroke="#41616a" stroke-width="1"/>
    <text x="742" y="222" font-family="Arial,sans-serif" font-size="12" fill="#b8c5c3">reachable through add-two</text>
    <text x="1084" y="222" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#e8c27a">keep</text>
    <text x="742" y="244" font-family="Arial,sans-serif" font-size="11" fill="#82999a">when the last pointer disappears, collection may reclaim it</text>
  </g>

  <g>
    <rect x="34" y="292" width="1072" height="64" rx="9" fill="#17262b" stroke="#41616a" stroke-width="1.5"/>
    <text x="54" y="317" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.3" fill="#79b7ab">SLAB PAGE / COLLECTOR</text>
    <text x="54" y="340" font-family="Arial,sans-serif" font-size="11" fill="#b8c5c3">mark from roots</text>
    <path d="M 150 336 H 176" stroke="#79b7ab" stroke-width="2" marker-end="url(#small-arrow)"/>
    <g transform="translate(188 309)">
      <rect width="432" height="31" rx="5" fill="url(#grid)" stroke="#41616a"/>
      <rect x="7" y="7" width="28" height="17" rx="3" fill="#79b7ab"/>
      <rect x="43" y="7" width="28" height="17" rx="3" fill="#79b7ab"/>
      <rect x="79" y="7" width="28" height="17" rx="3" fill="#e8c27a"/>
      <rect x="115" y="7" width="28" height="17" rx="3" fill="#79b7ab"/>
      <rect x="151" y="7" width="28" height="17" rx="3" fill="#233a40" stroke="#557178"/>
      <rect x="187" y="7" width="28" height="17" rx="3" fill="#233a40" stroke="#557178"/>
      <rect x="223" y="7" width="28" height="17" rx="3" fill="#233a40" stroke="#557178"/>
      <rect x="259" y="7" width="28" height="17" rx="3" fill="#233a40" stroke="#557178"/>
      <rect x="295" y="7" width="28" height="17" rx="3" fill="#233a40" stroke="#557178"/>
      <rect x="331" y="7" width="28" height="17" rx="3" fill="#233a40" stroke="#557178"/>
      <rect x="367" y="7" width="28" height="17" rx="3" fill="#233a40" stroke="#557178"/>
      <rect x="403" y="7" width="22" height="17" rx="3" fill="#233a40" stroke="#557178"/>
    </g>
    <text x="640" y="327" font-family="Arial,sans-serif" font-size="11" fill="#b8c5c3">reachable slots stay allocated</text>
    <text x="640" y="344" font-family="Arial,sans-serif" font-size="11" fill="#82999a">empty slots return to the pool</text>
    <path d="M 948 327 H 977" stroke="#d98b55" stroke-width="2" marker-end="url(#small-arrow)"/>
    <text x="988" y="331" font-family="Arial,sans-serif" font-size="11" fill="#e8c27a">sweep</text>
  </g>
</svg>
