<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Two roots and an unreachable branch</title>
  <desc id="desc">Two blue root circles at the top each lead down to branching green objects. A separate branching group of grey objects has no path from either root and can be reclaimed.</desc>
  <defs>
    <marker id="arrow-live" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5.5 L1 10" fill="none" stroke="#32877b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-dead" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5.5 L1 10" fill="none" stroke="#879298" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#f5f2e9"/>
  <rect x="34" y="32" width="1132" height="616" rx="24" fill="#fbfaf6" stroke="#d6d3c8" stroke-width="2"/>
  <text x="76" y="98" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#233440">Roots and reachable objects</text>
  <text x="76" y="137" font-family="Arial,sans-serif" font-size="20" fill="#52636b">Collection follows every path from the program’s live references.</text>
  <text x="76" y="190" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#4277a3">ROOTS</text>
  <text x="855" y="190" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#737f84">NO PATH FROM A ROOT</text>
  <line x1="795" y1="190" x2="795" y2="580" stroke="#d6d3c8" stroke-width="2" stroke-dasharray="6 8"/>
  <!-- References are drawn behind the nodes. -->
  <g fill="none" stroke="#32877b" stroke-width="4" marker-end="url(#arrow-live)">
    <path d="M230 271 V324"/><path d="M230 410 L145 490"/><path d="M230 410 L315 490"/>
    <path d="M605 271 V324"/><path d="M605 410 L520 490"/><path d="M605 410 L690 490"/>
  </g>
  <g fill="none" stroke="#879298" stroke-width="4" marker-end="url(#arrow-dead)">
    <path d="M980 401 L895 490"/><path d="M980 401 L1065 490"/>
  </g>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <circle cx="230" cy="225" r="46" fill="#e1edf5" stroke="#4277a3" stroke-width="3"/>
    <text x="230" y="219" font-size="18" font-weight="700" fill="#214f73">Global</text><text x="230" y="241" font-size="18" font-weight="700" fill="#214f73">value</text>
    <circle cx="605" cy="225" r="46" fill="#e1edf5" stroke="#4277a3" stroke-width="3"/>
    <text x="605" y="219" font-size="18" font-weight="700" fill="#214f73">Active</text><text x="605" y="241" font-size="18" font-weight="700" fill="#214f73">call</text>
    <g fill="#d9eee6" stroke="#32877b" stroke-width="3">
      <circle cx="230" cy="365" r="44"/><circle cx="145" cy="535" r="44"/><circle cx="315" cy="535" r="44"/>
      <circle cx="605" cy="365" r="44"/><circle cx="520" cy="535" r="44"/><circle cx="690" cy="535" r="44"/>
    </g>
    <g font-size="22" font-weight="700" fill="#22695f">
      <text x="230" y="372">A</text><text x="145" y="542">B</text><text x="315" y="542">C</text>
      <text x="605" y="372">D</text><text x="520" y="542">E</text><text x="690" y="542">F</text>
    </g>
    <g fill="#e5e8e8" stroke="#879298" stroke-width="3">
      <circle cx="980" cy="365" r="44"/><circle cx="895" cy="535" r="44"/><circle cx="1065" cy="535" r="44"/>
    </g>
    <g font-size="22" font-weight="700" fill="#5c686d">
      <text x="980" y="372">G</text><text x="895" y="542">H</text><text x="1065" y="542">I</text>
    </g>
  </g>
  <text x="980" y="609" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#5c686d">Can be reclaimed</text>
</svg>
