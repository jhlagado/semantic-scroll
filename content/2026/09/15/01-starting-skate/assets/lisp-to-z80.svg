<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
<title id="title">From a Scheme expression to a Z80 program</title>
<desc id="desc">The Scheme expression (+ (* 2 3) 4) multiplies 2 by 3 and adds 4, producing 10. A separate diagram shows Skate's planned compilation route from Scheme source through a streaming compiler and linker, with a runtime, to a native CP/M program. The expression tree explains nesting; it is not a compiler storage structure.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#536657" stroke-width="1.3"/></marker></defs>
<rect width="1000" height="760" rx="12" fill="#faf6e9"/>
<g fill="#26362e" font-family="Helvetica,Arial,sans-serif">
<text x="44" y="47" font-size="13" letter-spacing="2" fill="#536657">BUILDING SKATE / SCHEME → Z80</text>
<text x="44" y="92" font-size="31" font-weight="bold">An expression inside an expression</text>
<text x="44" y="125" font-size="18">In a procedure call, the procedure comes first, followed by its arguments.</text>
<rect x="44" y="157" width="360" height="99" rx="6" fill="#eee7d6"/>
<text x="67" y="190" font-size="13" letter-spacing="1.5">SCHEME SOURCE</text>
<text x="67" y="232" font-size="31" font-family="Menlo,monospace">(+ (* 2 3) 4)</text>
<text x="44" y="303" font-size="20">Multiply 2 by 3, then add 4.</text>
<text x="44" y="338" font-size="18">The inner expression supplies a value</text>
<text x="44" y="365" font-size="18">to the surrounding expression.</text>
<rect x="44" y="395" width="360" height="66" rx="6" fill="#dce5d8"/>
<text x="66" y="436" font-size="22">Result: <tspan font-family="Menlo,monospace" font-weight="bold">10</tspan></text>
<g stroke="#536657" stroke-width="2" fill="none">
<path d="M619 192L557 278M660 192L792 278M532 319L493 393M554 319L610 393"/>
</g>
<g font-family="Menlo,monospace" font-size="27" text-anchor="middle">
<rect x="598" y="151" width="74" height="51" rx="5" fill="#c66531"/><text x="635" y="186" fill="white">+</text>
<rect x="509" y="277" width="74" height="51" rx="5" fill="#c66531"/><text x="546" y="312" fill="white">*</text>
<rect x="766" y="277" width="74" height="51" rx="5" fill="#eee7d6"/><text x="803" y="312">4</text>
<rect x="452" y="392" width="74" height="51" rx="5" fill="#eee7d6"/><text x="489" y="427">2</text>
<rect x="580" y="392" width="74" height="51" rx="5" fill="#eee7d6"/><text x="617" y="427">3</text>
</g>
<text x="696" y="183" font-size="17">6 + 4 → 10</text>
<text x="607" y="310" font-size="17">2 × 3 → 6</text>
<path d="M44 495H956" stroke="#c7c1af"/>
<text x="44" y="531" font-size="14" letter-spacing="1.6" fill="#536657">SKATE’S PLANNED COMPILATION PATH</text>
<g stroke="#536657" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path d="M212 590H257M459 590H504M666 590H711M585 668V627"/>
</g>
<g fill="#eee7d6" stroke="#c7c1af"><rect x="44" y="557" width="168" height="66" rx="5"/><rect x="264" y="557" width="195" height="66" rx="5"/><rect x="511" y="557" width="155" height="66" rx="5"/><rect x="718" y="557" width="238" height="66" rx="5"/></g>
<g font-size="19" text-anchor="middle"><text x="128" y="596">Scheme source</text><text x="361" y="585">Streaming</text><text x="361" y="609">compiler</text><text x="588" y="596">Linker</text><text x="837" y="585">Native Z80 program</text><text x="837" y="609">CP/M .COM file</text></g>
<rect x="493" y="672" width="189" height="43" rx="5" fill="#dce5d8"/><text x="588" y="700" font-size="18" text-anchor="middle">Runtime support</text>
<text x="44" y="654" font-size="15" fill="#536657">The tree explains expression nesting;</text><text x="44" y="676" font-size="15" fill="#536657">Skate will emit code incrementally.</text>

</g></svg>
