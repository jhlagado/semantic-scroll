<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<title>SKATE — Scheme for an eight-bit machine</title>
<desc>A notebook-style conceptual drawing of a roller skate with a boot, chassis and wheels. Side and underside views accompany a simple Scheme source to compiler to Z80 code path. Not a fabrication drawing.</desc>
